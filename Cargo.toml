# JSON text to a value tree and back. Depth cap 64. Input cap 16 MiB.
# Callers: anvil-script (in anvil-engine), anvil-net (cookies and policy),
# anvil-sandbox (IPC), and anvil-browser (profile snapshot and download records).

[package]
name = "anvil-json"
version = "0.3.2"
edition = "2024"
rust-version = "1.99.1"
authors = ["Buntato <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "JSON parser and serializer with a depth cap and a size cap."
repository = "https://github.com/buntatoes/anvil-json"
homepage = "https://github.com/buntatoes/anvil-json"
readme = "README.md"
keywords = ["json", "parser", "serializer"]
categories = ["encoding", "parser-implementations"]
publish = false
